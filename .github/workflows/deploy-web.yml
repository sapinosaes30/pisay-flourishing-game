name: Build and deploy PISAY Floating Islands

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Install game dependencies
        run: python -m pip install -r requirements.txt

      - name: Install pygbag
        run: python -m pip install --upgrade pygbag==0.9.3

      - name: Validate project
        run: |
          python validate_project.py
          python validate_quest_logic.py
          python validate_web_ready.py

      - name: Build browser game
        run: python -m pygbag --build --title "PISAY FLOATING ISLANDS" .

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./build/web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
